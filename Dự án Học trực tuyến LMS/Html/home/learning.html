<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học tập - Hệ thống LMS Cyber</title>

    <link rel="stylesheet" href="../../CSS/main.css">
    <link rel="stylesheet" href="../../CSS/learning.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =======================================================
           1. BIẾN MÀU SẮC & NỀN
        ======================================================= */
        :root {
            --primary: #00d2ff; --secondary: #ff00cc; --accent: #ff4d6d;
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        /* =======================================================
           2. HEADER ĐỒNG BỘ (CAO 90PX, CHỮ 16PX)
        ======================================================= */
        .navbar {
            display: flex !important; 
            justify-content: space-between !important; 
            align-items: center !important;
            padding: 0 5% !important; 
            height: 90px !important; 
            background: rgba(0, 0, 0, 0.95) !important; 
            backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 9999;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-weight: 800 !important; 
            font-size: 30px !important; 
            letter-spacing: 1px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; cursor: pointer;
            flex: 0 0 auto;
        }

        .menu { 
            display: flex !important; 
            gap: 35px !important; 
            list-style: none !important; 
            flex: 1 !important; 
            justify-content: center !important; 
        }
        .menu li { 
            font-size: 16px !important; 
            font-weight: 600 !important; 
            color: #fff !important; 
            cursor: pointer; 
            transition: 0.3s; 
            white-space: nowrap; 
        }
        .menu li.active, .menu li:hover { color: var(--primary) !important; }

        .auth { 
            display: flex !important; 
            align-items: center !important; 
            gap: 20px !important; 
            flex: 0 0 auto;
            justify-content: flex-end;
        }
        
        .cart-wrapper { position: relative; cursor: pointer; font-size: 24px; color: #fff; transition: 0.3s; }
        .cart-wrapper:hover { color: var(--primary); }
        .cart-badge {
            position: absolute; top: -7px; right: -9px; background: var(--secondary);
            color: white; font-size: 11px; font-weight: 800; padding: 2px 7px;
            border-radius: 50%; border: 2px solid #000;
            display: block; /* Đảm bảo luôn hiện */
        }

        .user-info { color: var(--primary); font-weight: bold; font-size: 16px; }
        .separator { color: rgba(255, 255, 255, 0.2); margin: 0 5px; font-size: 18px; }

        .btn-logout-nav { 
            background: transparent !important; 
            color: var(--accent) !important; 
            border: 1px solid var(--accent) !important;
            padding: 8px 22px !important; 
            border-radius: 12px !important; 
            font-size: 13px !important; 
            font-weight: 700 !important; 
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-logout-nav:hover { background: var(--accent) !important; color: white !important; }

        /* =======================================================
           3. CSS KHÓA HỌC
        ======================================================= */
        .course-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            transition: 0.3s;
            text-align: left;
        }
        .course-card:hover { transform: translateY(-8px); border-color: #ff00cc; }
        .course-card h4 { color: #ffffff; font-size: 1.1rem; margin: 15px 0 8px 0; line-height: 1.4; }
        .course-card .price { display: block; margin-top: 15px; color: #2ecc71; font-weight: 800; font-size: 1.2rem; }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo" onclick="location.href='index.html'">CODELEARN</div>
    <ul class="menu">
        <li onclick="location.href='index.html'">Trang chủ</li>
        <li onclick="location.href='learning.html'" class="active">Học tập</li>
        <li onclick="location.href='training.html'">Luyện tập</li> 
        <li onclick="location.href='order-history.html'">Lịch Sử Đơn Hàng</li>
        <li onclick="location.href='event.html'">Sự kiện</li>
        <li onclick="location.href='about.html'">Giới thiệu</li>
        <li onclick="location.href='coupon.html'">Mã giảm giá</li>
    </ul>
    <div class="auth" id="nav-auth"></div>
</nav>

<div class="banner">
    <h2>GIẢM GIÁ KHÓA HỌC</h2>
    <p>Ưu đãi lên tới 50% cho học viên mới</p>
</div>

<div class="filter">
    <div class="filter-wrapper">
        <input type="text" id="searchInput" placeholder="Tìm kiếm kỹ năng bạn muốn học..." onkeyup="filterCourses()">
        <button><i class="fas fa-search"></i></button>
    </div>
</div>

<div class="courses" id="course-list">
    <p style="text-align: center; width: 100%; color: #bdc3c7;">Đang tải danh sách khóa học...</p>
</div>

<script>
    const API_URL = 'http://127.0.0.1:5001/api';
    let allCourses = []; 

    // FIX: Cập nhật số lượng giỏ hàng (LUÔN HIỆN SỐ 0)
    function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const badge = document.getElementById('cart-count');
        if (badge) {
            badge.innerText = cart.length;
            badge.style.display = 'block'; // Luôn luôn hiện block, kể cả khi length = 0
        }
    }

    function checkAuth() {
        const userStr = localStorage.getItem('user');
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const navAuth = document.getElementById('nav-auth');

        if (userStr) {
            const user = JSON.parse(userStr);
            navAuth.innerHTML = `
                <div class="cart-wrapper" onclick="location.href='cart.html'">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </div>
                <span class="user-info">Chào, ${user.username}</span>
                <span class="separator">|</span>
                <button class="btn-logout-nav" onclick="handleLogout()">Đăng xuất</button>
            `;
            updateCartBadge(); // Gọi hàm này để cập nhật con số thực tế
        } else {
            navAuth.innerHTML = `<a href="../account/login.html" style="color: white; text-decoration: none; font-weight: 700; font-size: 15px;">Đăng nhập</a>`;
        }
    }

    function handleLogout() { localStorage.removeItem('user'); window.location.reload(); }

    async function fetchCourses() {
        try {
            const res = await fetch(`${API_URL}/courses`);
            const data = await res.json();
            if (data.status === "success") {
                allCourses = data.data; 
                renderCourses(allCourses);
            }
        } catch (error) {
            document.getElementById('course-list').innerHTML = "<p style='color:#ff4757; text-align:center; width:100%;'>❌ Lỗi Server. Hãy bật app.py Nhóm 10 nhé!</p>";
        }
    }

    function renderCourses(coursesData) {
        const container = document.getElementById('course-list');
        if(!container) return;
        container.innerHTML = ''; 
        coursesData.forEach(course => {
            const priceDisplay = course.price == 0 ? 'Miễn phí' : `${Number(course.price).toLocaleString('vi-VN')} đ`;
            const imgUrl = `https://placehold.jp/24/34495e/ffffff/250x140.png?text=${encodeURIComponent(course.title)}`;
            container.innerHTML += `
                <div class="course-card">
                    <img src="${imgUrl}" alt="Course">
                    <div class="category-tag">${course.category}</div>
                    <h4>${course.title}</h4>
                    <span class="price">${priceDisplay}</span>
                    <button class="btn-enroll" onclick="location.href='course-detail.html?id=${course.id}'">Xem chi tiết</button>
                </div>
            `;
        });
    }

    function filterCourses() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allCourses.filter(course => 
            course.title.toLowerCase().includes(keyword) || 
            course.category.toLowerCase().includes(keyword)
        );
        renderCourses(filtered);
    }

    window.onload = () => {
        checkAuth();
        fetchCourses();
    };
</script>

</body>
</html>
